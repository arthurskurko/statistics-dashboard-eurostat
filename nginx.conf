server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Root-level WHO proxy (works when app is hosted at /)
  location /api/who/ {
    proxy_pass https://ghoapi.azureedge.net/;
    proxy_set_header Host ghoapi.azureedge.net;
    proxy_ssl_server_name on;
  }

  # Base-prefixed WHO proxy for test deployment under /statistics/
  location /statistics/api/who/ {
    proxy_pass https://ghoapi.azureedge.net/;
    proxy_set_header Host ghoapi.azureedge.net;
    proxy_ssl_server_name on;
  }

  # Optional base-prefixed proxy without /who segment
  # Maps /statistics/api/<rest> -> https://ghoapi.azureedge.net/api/<rest>
  location /statistics/api/ {
    proxy_pass https://ghoapi.azureedge.net/api/;
    proxy_set_header Host ghoapi.azureedge.net;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
